<!DOCTYPE html>
<!-- Channel profile picture source (800 x 800). YouTube crops it to a circle. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Facts Not Vibes avatar</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 800px; height: 800px; overflow: hidden; background: #070a14; }
</style>
</head>
<body>
<svg width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1a2858"/>
      <stop offset="1" stop-color="#070a14"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- Orbit ring (space) with a coral "planet" (health) riding on it -->
  <ellipse cx="400" cy="410" rx="290" ry="118" fill="none" stroke="#4fd6ff" stroke-width="18"
           transform="rotate(-20 400 410)" filter="url(#glow)"/>
  <!-- The check: verified -->
  <path d="M 250 420 L 355 520 L 565 270" fill="none" stroke="#f5f7fb"
        stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="670" cy="318" r="34" fill="#ff5d5d" filter="url(#glow)"/>
</svg>
</body>
</html>
